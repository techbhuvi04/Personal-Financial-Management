# Production-oriented defaults. Every deployment-specific value is read from an environment variable;
# no credentials are stored in this file.
spring:
  application:
    name: personal-finance-manager
  datasource:
    # Either set DB_URL (a full JDBC URL) or DB_HOST/DB_PORT/DB_NAME (as exposed by Render's managed PostgreSQL).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance}}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-float-as-int: false
    mapper:
      accept-case-insensitive-enums: true
    # Strict date parsing: only yyyy-MM-dd is accepted for LocalDate fields.
    default-leniency: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  # Render and similar platforms terminate TLS at a proxy; honour X-Forwarded-* so redirects and
  # request.isSecure() reflect the original HTTPS request.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        name: ${SESSION_COOKIE_NAME:JSESSIONID}
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:strict}
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

app:
  # Business clock zone used for "today" (future-date checks, goal start date default, goal progress end date).
  time-zone: ${APP_TIME_ZONE:UTC}
  # Request bodies above this size are rejected with 413 before they are parsed.
  max-request-size: ${MAX_REQUEST_SIZE:16KB}
  security:
    # When true, state-changing requests (except register/login) must echo the XSRF-TOKEN cookie in the
    # X-XSRF-TOKEN header. See README "CSRF" for why this defaults to false.
    csrf-enabled: ${CSRF_ENABLED:false}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
